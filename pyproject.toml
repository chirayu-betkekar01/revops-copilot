[project]
name = "revops-copilot"
version = "0.1.0"
description = "HubSpot deals -> bookings forecast -> sales comp modelling, with Bedrock agents."
requires-python = ">=3.12"
dependencies = []

# Dependency groups: each Docker image installs only the group it needs,
# so the API image doesn't carry Streamlit (and its ~100 MB of pandas/pyarrow).
[dependency-groups]
agent = [
    "boto3>=1.44.9",
    "psycopg[binary]>=3.3.9",
    "sqlglot>=30.33.0",
]
# The API runs the analyst agent behind /agent/chat, so it includes the agent group.
api = [
    { include-group = "agent" },
    "fastapi>=0.165.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "uvicorn[standard]>=0.54.0",
]
dashboard = [
    "httpx>=0.28.1",
    "streamlit>=1.67.0",
]
seed = [
    "httpx>=0.28.1",
]
sync = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
]
comp = [
    "psycopg[binary]>=3.3.9",
    "pyyaml>=6.0.4",
]
# Your laptop gets everything: all groups above plus the dev tools.
dev = [
    { include-group = "api" },
    { include-group = "dashboard" },
    { include-group = "seed" },
    { include-group = "sync" },
    { include-group = "comp" },
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes basics, I = import sorting, UP = modern syntax,
# B = common bug patterns.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

# boto3/botocore ship without type hints; the agent wraps the client in a typed Protocol.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `from app import main`
