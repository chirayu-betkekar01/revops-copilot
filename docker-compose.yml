# Local stack for RevOps Copilot: Postgres, the FastAPI service and the Streamlit dashboard.
# Docker Compose reads .env from this folder automatically and fills in every ${...} below.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # laptop port : container port
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: the database files live here, so data survives `just down`.
      # `docker compose down -v` deletes it (and all your data).
      - pgdata:/var/lib/postgresql/data
      # SQL files Postgres runs once, on the first start with an empty volume.
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready asks "are you accepting connections?". $$ means "use the container's
      # own variable", not one from .env.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .                 # repo root, so the Dockerfile can see pyproject.toml + uv.lock
      dockerfile: app/Dockerfile
    environment:
      # Host is "db" (the service name above), not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Analyst agent (Step 6): its read-only DB login and the Bedrock model/profile to use.
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      AWS_PROFILE: ${AWS_PROFILE:-revops}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.amazon.nova-2-lite-v1:0}
    volumes:
      # Your AWS CLI config + SSO login cache, so the agent can call Bedrock as you.
      # No keys are copied into the image; run `aws sso login --profile revops` on your laptop
      # when the login expires. Writable because botocore refreshes the cached SSO token.
      - ${USERPROFILE}/.aws:/root/.aws
    ports:
      # Laptop side is configurable; containers always talk to each other on 8000.
      - "${API_PORT:-8000}:8000"
    # Wait until Postgres passes its healthcheck, not just until its container starts.
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      - api

volumes:
  pgdata:
